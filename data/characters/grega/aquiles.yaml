  - id: furia
    nome: "Fúria de Pélida"
    tipo: acao_continua
    custo: { vigor: 2, generica: 1 }
    cooldown: 4
    duracao: 3
    alvo: si_mesmo
    efeitos:
      - { tipo: buff_dano, valor: 15, duracao: 3 }
