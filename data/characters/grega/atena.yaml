id: atena
nome: Atena
mitologia: Grega
arquetipo: support
hp_base: 95
descricao: |
  Deusa da sabedoria e da estratégia. Em batalha, fortalece os aliados
  com conselhos certeiros e ergue defesas divinas.

habilidades:
  - id: lanca_sabedoria
    nome: "Lança da Sabedoria"
    tipo: instantanea
    custo: { mente: 1 }
    cooldown: 0
    alvo: inimigo_unico
    efeitos:
      - { tipo: dano, valor: 15, classe: magico }

  - id: conselho
    nome: "Conselho"
    tipo: instantanea
    custo: { mente: 1, generica: 1 }
    cooldown: 2
    alvo: aliado_unico
    efeitos:
      - { tipo: reducao_dano, valor: 15, duracao: 2 }

  - id: egide
    nome: "Égide"
    tipo: instantanea
    custo: { mente: 2, generica: 2 }
    cooldown: 5
    alvo: todos_aliados
    efeitos:
      - { tipo: escudo_destrutivel, valor: 25 }
