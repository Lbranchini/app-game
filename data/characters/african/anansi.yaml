id: anansi
name: Anansi
mythology: African
archetype: stunner
base_hp: 90
description: |
  The trickster spider of Akan folklore. Weaves traps that paralyze the
  unwary.

skills:
  - id: spider_thread
    name: "Spider Thread"
    kind: instant
    cost: { mind: 1 }
    cooldown: 0
    target: single_enemy
    effects:
      - { kind: damage, value: 12, damage_class: magical }
      - { kind: essence_drain, value: 1 }

  - id: trap
    name: "Trap"
    kind: instant
    cost: { mind: 2 }
    cooldown: 3
    target: single_enemy
    effects:
      - { kind: status, status: stun, duration: 1, value: 0 }
      - { kind: damage, value: 10, damage_class: magical }

  - id: web_of_lies
    name: "Web of Lies"
    kind: instant
    cost: { mind: 3, generic: 2 }
    cooldown: 6
    target: all_enemies
    effects:
      - { kind: status, status: stun, duration: 1, value: 0 }
