  - id: family_honor
    name: "Family Honor"
    kind: instant
    cost: { vigor: 2, generic: 1 }
    cooldown: 5
    target: single_enemy
    effects:
      - { kind: damage, value: 40, damage_class: physical, piercing: true, "true": true }
