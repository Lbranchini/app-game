id: thor
name: Thor
mythology: Norse
archetype: damage_dealer
base_hp: 105
description: |
  God of thunder. Wields Mjolnir, the hammer that breaks mountains.

skills:
  - id: mjolnir
    name: "Mjolnir"
    kind: instant
    cost: { vigor: 1, spirit: 1 }
    cooldown: 0
    target: single_enemy
    description: "Thor hurls Mjolnir at target enemy with the force of a
      thunderstorm, dealing 25 physical damage."
    effects:
      - { kind: damage, value: 25, damage_class: physical }

  - id: side_thunder
    name: "Side Thunder"
    kind: instant
    cost: { spirit: 2 }
    cooldown: 2
    target: all_enemies
    description: "Thor raises his hammer and calls a bolt of lightning down on all
      enemies, dealing 18 magical damage to each."
    effects:
      - { kind: damage, value: 18, damage_class: magical }

  - id: ragnarok
    name: "Ragnarok"
    kind: instant
    cost: { spirit: 3, generic: 1 }
    cooldown: 5
    target: all_enemies
    description: "Thor unleashes the full force of Ragnarok upon all enemies,
      dealing 35 piercing magical damage and leaving them disarmed for 1 turn."
    effects:
      - { kind: damage, value: 35, damage_class: magical, piercing: true }
      - { kind: status, status: disarm, duration: 1, value: 0 }
