id: loki
name: Loki
mythology: Norse
archetype: trickster
base_hp: 85
description: |
  The trickster god. Lies, shapeshifts, and turns enemies' weapons against
  themselves.

skills:
  - id: golden_lie
    name: "Golden Lie"
    kind: instant
    cost: { mind: 1 }
    cooldown: 0
    target: single_enemy
    description: "Loki weaves a golden deception against target enemy, dealing 15
      mental damage and draining 1 of their essence."
    effects:
      - { kind: damage, value: 15, damage_class: mental }
      - { kind: essence_drain, value: 1 }

  - id: mirror_image
    name: "Mirror Image"
    kind: instant
    cost: { mind: 1, generic: 1 }
    cooldown: 3
    target: single_enemy
    description: "Loki copies the target's last-used skill into his own kit
      for the next 2 turns. Pays the cost of the copied skill from his own
      essence pool when used."
    effects:
      # `copy` reads target.last_skill_id and grants the source a temporary
      # entry in granted_skills for `duration` of the source's turns.
      - { kind: copy, value: 0, duration: 2 }

  - id: asgard_deceit
    name: "Asgard's Deceit"
    kind: ongoing
    cost: { mind: 2, generic: 1 }
    cooldown: 6
    duration: 2
    target: self
    description: "Loki cloaks himself in layered misdirection — for the next 2
      turns, any skill aimed directly at him is reflected back upon its caster."
    effects:
      # The next enemy skill aimed at Loki bounces back to its caster.
      # Reflective is a one-shot status — duration is the wait window.
      - { kind: status, status: reflective, duration: 2 }
