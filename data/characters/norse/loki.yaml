id: loki
name: Loki
mythology: Norse
archetype: trickster
base_hp: 85
description: |
  The trickster god. Lies, shapeshifts, and turns enemies' weapons against
  themselves.

skills:
  - id: golden_lie
    name: "Golden Lie"
    kind: instant
    cost: { mind: 1 }
    cooldown: 0
    target: single_enemy
    effects:
      - { kind: damage, value: 15, damage_class: mental }
      - { kind: essence_drain, value: 1 }

  - id: shapeshift
    name: "Shapeshift"
    kind: instant
    cost: { mind: 1, generic: 1 }
    cooldown: 3
    target: self
    effects:
      - { kind: damage_buff, value: 10, duration: 2 }
      - { kind: damage_reduction, value: 10, duration: 2 }

  - id: asgard_deceit
    name: "Asgard's Deceit"
    kind: ongoing
    cost: { mind: 2, generic: 2 }
    cooldown: 6
    duration: 1
    target: self
    effects:
      - { kind: status, status: marked, duration: 1, value: 0 }
      - { kind: damage_reduction, value: 30, duration: 1 }
