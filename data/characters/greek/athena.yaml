id: athena
name: Athena
mythology: Greek
archetype: support
base_hp: 95
description: |
  Goddess of wisdom and strategy. In battle, she bolsters allies with sound
  counsel and raises divine defenses.

skills:
  - id: spear_of_wisdom
    name: "Spear of Wisdom"
    kind: instant
    cost: { mind: 1 }
    cooldown: 0
    target: single_enemy
    description: "Athena channels divine wisdom through her spear, dealing 15
      magical damage to target enemy."
    effects:
      - { kind: damage, value: 15, damage_class: magical }

  - id: counsel
    name: "Counsel"
    kind: instant
    cost: { mind: 1, generic: 1 }
    cooldown: 2
    target: single_ally
    description: "Athena grants her strategic counsel to target ally, reducing all
      damage they receive by 15 for 2 turns."
    effects:
      - { kind: damage_reduction, value: 15, duration: 2 }

  - id: aegis
    name: "Aegis"
    kind: instant
    cost: { mind: 2, generic: 2 }
    cooldown: 5
    target: all_allies
    description: "Athena raises the legendary Aegis, enveloping all allies in divine
      protection and granting each a 25-point destructible barrier."
    effects:
      - { kind: destructible_shield, value: 25 }
