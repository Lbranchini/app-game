; Alembic configuration. The actual database URL is read from the
; environment via env.py — this file just points at the migration scripts.
;
; Common workflow:
;   alembic upgrade head        # apply all pending migrations
;   alembic revision --autogenerate -m "describe change"
;   alembic current             # which revision is the database at
;   alembic history             # all revisions and their order

[alembic]
script_location = alembic
prepend_sys_path = src
version_path_separator = os

; sqlalchemy.url is intentionally blank — env.py overrides it from
; settings.database_url so prod deployments only need DATABASE_URL.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
