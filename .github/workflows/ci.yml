name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-flight run when a newer commit arrives on the same PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (pytest + ruff + mypy + alembic)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/pyproject.toml

      - name: Install backend (editable, dev extras)
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Type check (mypy --strict)
        run: mypy --strict src

      - name: Tests (pytest with coverage)
        run: pytest --cov=agora --cov-report=xml --cov-report=term-missing

      - name: Smoke-test Alembic upgrade
        env:
          DATABASE_URL: sqlite:///ci_alembic.db
        run: |
          alembic upgrade head
          alembic downgrade base
          rm -f ci_alembic.db

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-coverage
          path: server/coverage.xml
          if-no-files-found: warn

  web:
    name: Web (tsc + eslint + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package.json

      - name: Install web deps
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npx tsc --noEmit -p .

      # Lint is best-effort while ESLint v9 config is migrated upstream.
      - name: Lint (ESLint, non-blocking)
        run: npm run lint || echo "::warning::eslint failed (non-blocking)"

      - name: Tests (vitest)
        run: npm test -- --run
